[general]
	#Maximum range (in blocks) for the playVoice() method's rad parameter. Any value larger than this will be clamped. Default: 128
	# Default: 128.0
	# Range: 1.0 ~ 1.7976931348623157E308
	globalMaxRange = 128.0
	#Minimum interval in milliseconds between speech plays.
	# Default: 0
	# Range: > 0
	speechMaxFrequency = 0
	#Maximum data size for a cassette tape, in bytes. Default: 1MB (1048576)
	# Default: 1048576
	# Range: > 1024
	cassetteTapeSizeLimit = 1048576
	#Maximum volume for cassette tape playback. Volume affects audible range (1.0 = 16m radius). Default: 3.0
	# Default: 3.0
	# Range: 0.1 ~ 10.0
	maxVolume = 3.0
	#If true, cassette audio data is sent to all online players regardless of distance. If false (default), only sent to players tracking the chunk (within view distance).
	cassetteBroadcastAudio = false
